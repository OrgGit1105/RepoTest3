version: "3.9"

services:
  vface-api-nginx:
    build:
      context: ./
      dockerfile: ./docker/nginx/Dockerfile
    ports:
      - 8092:80
    mem_limit: "512M"
    volumes:
      - type: bind
        source: ./
        target: /usr/share/nginx/html/vface
      - type: bind
        source: ./docker/nginx/vface.conf
        target: /etc/nginx/conf.d/default.conf
    environment:
      - TZ=Asia/Tokyo
    links:
      - vface-api-php

  vface-api-php:
      build:
        context: .
        dockerfile: ./docker/php/Dockerfile
      mem_limit: "512M"
      volumes:
        - type: bind
          source: ./
          target: /usr/share/nginx/html/vface
