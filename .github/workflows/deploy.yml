name: Deploy Develop
on:
  push:
    branches:
      - "develop"
      - "staging"
    paths-ignore:
      - '.github/**'
  workflow_dispatch:
jobs:
  deploy-steps:
    runs-on: self-hosted
    steps:
      - name: Check Branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/develop" ] && [ "${{ github.ref }}" != "refs/heads/staging" ] ; then
            echo "Workflow is only allowed for the develop branch. Exiting..."
            exit 1
          fi
      - uses: actions/checkout@v3
      
      - name: Clear Composer Cache
        run: composer clear-cache
      - name: Backend:Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      - name: Dumpauto-load
        run: composer dump-autoload
      - name: Backend:Directory Permissions
        run: chmod -R 777 storage
      - name: Install dependencies
        run: n 14 npm install

      - name: Build assets
        run: n 14 npm run prod
      - name: Deploy
        run: |
          if [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            export HOST="18.180.33.240"
            export USER="deploy"
            export DEPLOYPATH="/var/www/v-face/"
          elif [ "${{ github.ref }}" == "refs/heads/staging" ]; then
            export HOST="18.176.73.142"
            export USER="deploy"
            export DEPLOYPATH="/var/www/v-face-veho/"
          fi
          rsync -rzu --delete --exclude=.env --exclude=storage --exclude=vendor ./ $USER@$HOST:$DEPLOYPATH
          ssh $USER@$HOST "cd $DEPLOYPATH && /usr/bin/php82 /usr/local/bin/composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist && php82 artisan migrate --force && php82 artisan config:cache && php82 artisan route:cache && php82 artisan view:cach"
