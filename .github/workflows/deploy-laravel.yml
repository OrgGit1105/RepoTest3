name: Deploy Develop
on:
  push:
    branches:
      - "develop"
      - "staging"
    paths-ignore:
      - '.github/**'
  workflow_dispatch:
jobs:
  deploy-steps:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"
      - name: Backend:Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      - name: Dumpauto-load
        run: composer dump-autoload
      - name: Backend:Directory Permissions
        run: chmod -R 775 storage

      - name: Install dependencies
        run: n 14 npm install

      - name: Build assets
        run: n 14 npm run prod
      - name: Deploy
        run: |
          if [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            export HOST="18.180.33.240"
            export USER="deploy"
            export DEPLOYPATH="/var/www/v-face/"
          elif [ "${{ github.ref }}" == "refs/heads/staging" ]; then
            export HOST="18.180.33.240"
            export USER="deploy"
            export DEPLOYPATH="/var/www/v-face-veho/"
          fi
          rsync -rzu --delete --exclude=.env --exclude=storage --exclude=vendor ./ $USER@$HOST:$DEPLOYPATH
          ssh $USER@$HOST "cd $DEPLOYPATH && php82 artisan migrate --force"
